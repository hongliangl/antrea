<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
  <title id="title">Antrea outbound forwarding: normal and eBPF paths</title>
  <desc id="desc">Both outbound paths retain OVS. The accelerated path substitutes a gateway TC ingress program for normal host IP forwarding and netfilter, then uses kernel neighbor output. Unsupported packets fall back to the host stack.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526379"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2167c5"/></marker>
  </defs>
  <rect width="1200" height="485" rx="16" fill="#f6f8fc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b45">
    <text x="36" y="45" font-size="25" font-weight="700">OVS stays. The host-forwarding path gets shorter.</text>
    <text x="36" y="75" font-size="15" fill="#526379">Directly routed cross-Node Pod traffic · IPv4 and IPv6 · TCP / UDP</text>
    <text x="36" y="121" font-size="14" font-weight="700" fill="#526379">NORMAL OUTBOUND PATH</text>
    <g fill="#fff" stroke="#bdc9d9" stroke-width="1.5">
      <rect x="36" y="145" width="110" height="78" rx="10"/>
      <rect x="190" y="145" width="140" height="78" rx="10"/>
      <rect x="375" y="145" width="285" height="78" rx="10" fill="#fff3e5" stroke="#d69a52"/>
      <rect x="720" y="145" width="245" height="78" rx="10" fill="#e9f5ed" stroke="#7caf91"/>
      <rect x="1010" y="145" width="150" height="78" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="700">
      <text x="91" y="189">Local Pod</text><text x="260" y="178">OVS</text>
      <text x="517" y="177">Host IP forwarding</text><text x="842" y="177">Kernel neighbor output</text>
      <text x="1085" y="189">Peer Node</text>
    </g>
    <g text-anchor="middle" font-size="13" fill="#526379">
      <text x="260" y="201">Existing pipeline</text><text x="517" y="201">Routing + netfilter</text>
      <text x="842" y="201">ARP / NDP + Ethernet addresses</text>
    </g>
    <g fill="none" stroke="#526379" stroke-width="2" marker-end="url(#arrow)">
      <path d="M146 184 H186"/><path d="M330 184 H371"/><path d="M660 184 H716"/><path d="M965 184 H1006"/>
    </g>
    <text x="36" y="294" font-size="14" font-weight="700" fill="#2167c5">ACCELERATED OUTBOUND PATH</text>
    <g fill="#fff" stroke="#bdc9d9" stroke-width="1.5">
      <rect x="36" y="318" width="110" height="88" rx="10"/>
      <rect x="190" y="318" width="140" height="88" rx="10"/>
      <rect x="375" y="318" width="285" height="88" rx="10" fill="#e9f1ff" stroke="#6b98d5"/>
      <rect x="720" y="318" width="245" height="88" rx="10" fill="#e9f5ed" stroke="#7caf91"/>
      <rect x="1010" y="318" width="150" height="88" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="700">
      <text x="91" y="367">Local Pod</text><text x="260" y="351">OVS</text>
      <text x="517" y="350">TC ingress: hostdp_fwd</text><text x="842" y="350">Kernel neighbor output</text>
      <text x="1085" y="367">Peer Node</text>
    </g>
    <g text-anchor="middle" font-size="13" fill="#526379">
      <text x="260" y="376">Existing pipeline</text><text x="517" y="375">Classify · routes / FIB · MTU · TTL</text>
      <text x="842" y="375">bpf_redirect_neigh</text>
    </g>
    <g fill="none" stroke="#2167c5" stroke-width="2.5" marker-end="url(#blue-arrow)">
      <path d="M146 362 H186"/><path d="M330 362 H371"/><path d="M660 362 H716"/><path d="M965 362 H1006"/>
    </g>
    <path d="M517 318 V229" fill="none" stroke="#a16b2a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="538" y="255" font-size="13" fill="#885920">Unsupported / lookup or MTU fallback</text>
    <text x="538" y="277" font-size="13" fill="#885920">TC_ACT_OK → normal stack</text>
    <text x="344" y="432" font-size="13" fill="#526379">Gateway ingress</text>
    <text x="958" y="432" font-size="13" fill="#526379">Transport egress</text>
    <text x="36" y="469" font-size="12" fill="#526379">The accelerated path bypasses host forwarding / netfilter. Normal kernel routes remain installed.</text>
  </g>
</svg>
